services:
  backend:
    build: ./backend
    ports:
      - '8000:8000'
    env_file:
      - path: .env
        required: false
    environment:
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173}
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')",
        ]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    ports:
      - '5173:80'
    depends_on:
      backend:
        condition: service_healthy
