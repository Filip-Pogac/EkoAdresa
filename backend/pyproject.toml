[project]
name = "ekoadresa-backend"
version = "0.1.0"
description = "EkoAdresa API: environmental profile of an address"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "httpx2>=2.16.0",
    "pandas>=2.2",
    "pillow>=11",
    "pyarrow>=18",
    "pyproj>=3.6",
    "shapely>=2",
    "uvicorn[standard]>=0.32",
]

[dependency-groups]
dev = [
    "openpyxl>=3.1",
    "pytest>=8",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
